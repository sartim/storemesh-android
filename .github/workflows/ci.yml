name: Android CI

on:
  workflow_dispatch:
    inputs:
      run_emulator_smoke:
        description: Run the Android emulator smoke job
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]

concurrency:
  group: storemesh-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        run: ./gradlew test --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_emulator_smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          force-avd-creation: true
          wipe-data: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon
