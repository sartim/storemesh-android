name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release, for example 0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate and stamp version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$RELEASE_VERSION"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          sed -i "s/versionCode = [0-9]*/versionCode = $version_code/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$RELEASE_VERSION\"/" app/build.gradle.kts
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: storemesh-android-${{ inputs.version }}
          path: app/build/outputs/apk/release/*.apk
      - name: Commit version and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts
          git commit -m "release android v$RELEASE_VERSION"
          git tag "$RELEASE_TAG"
          git push origin HEAD:main "$RELEASE_TAG"
